[tool.poetry]
name = "xfoil-wrapper"
version = "0.1.0"
description = "Python wrapper for XFOIL with geometry and output utilities."
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "geometry" },
    { include = "wrapper" },
    { include = "outputs" }
]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = ">=1.24"
scipy = ">=1.11"
plotly = ">=5.0"
pandas = ">=2.0"
pydantic = ">=2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
